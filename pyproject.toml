# Developer tooling only. AIDevWorkflow is not packaged from this file and has no runtime dependencies: the skill in
# skills/ai-dev-workflow/ uses the Python standard library only, and install.py copies only that folder.
# Dev tools: python3 -m venv .venv && .venv/bin/pip install -r requirements-dev.txt

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# ruff's default rule set (pyflakes and the pycodestyle error subset). Widen it after the F1.0.3 module split.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
files = ["skills/ai-dev-workflow/scripts", "tools"]
warn_unused_ignores = true
